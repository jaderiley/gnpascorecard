        '<div class="tm-subtotal"><span>Doubles total</span><span>' + hDoublesScore + ' – ' + aDoublesScore + '</span></div>' +
      '</div>' +
      '<div class="tm-grand"><span>Grand Total</span><span>' + grand.h + ' – ' + grand.a + '</span></div>';

    bindTabs();
  }

  function renderGridJuniors(){
    var t = totals();
    var rowsHtml = '';
    var hTotalPoints = 0, aTotalPoints = 0;
    var hGameWins = 0, aGameWins = 0;

    for(var g=0;g<JUNIORS_GAMES.length;g++){
      var pair = JUNIORS_GAMES[g];
      var hi = pair[0], ai = pair[1];
      var hN = state.homePlayers[hi] || ('Home ' + (hi+1));
      var aN = state.awayPlayers[ai] || ('Away ' + (ai+1));
      var game = state.juniorsGames[g] || {home:0,away:0};
      hTotalPoints += game.home;
      aTotalPoints += game.away;
      var winner = null;
      if(game.home >= JUNIORS_RACE_TO){ winner = 'H'; hGameWins++; }
      else if(game.away >= JUNIORS_RACE_TO){ winner = 'A'; aGameWins++; }
      var hCls = winner==='H' ? 'home' : '';
      var aCls = winner==='A' ? 'away' : '';
      rowsHtml +=
        '<tr>' +
          '<td class="tm-pos">R' + (g+1) + '</td>' +
          '<td class="tm-name">' + escapeHtml(hN) + '</td>' +
          '<td class="tm-score ' + hCls + '">' + game.home + '</td>' +
          '<td class="tm-vs">vs</td>' +
          '<td class="tm-score ' + aCls + '">' + game.away + '</td>' +
          '<td class="tm-name tm-right">' + escapeHtml(aN) + '</td>' +
        '</tr>';
    }

    app.innerHTML = headerHtml('grid') +
      '<div class="grid-help">Read-only overview · edit scores in the Play tab</div>' +
      '<div class="tm-card">' +
        '<div class="tm-section-title">Rounds (race to ' + JUNIORS_RACE_TO + ')</div>' +
        '<table class="tm-table"><tbody>' + rowsHtml + '</tbody></table>' +
        '<div class="tm-subtotal"><span>Rounds won</span><span>' + hGameWins + ' – ' + aGameWins + '</span></div>' +
        '<div class="tm-subtotal"><span>Points scored</span><span>' + hTotalPoints + ' – ' + aTotalPoints + '</span></div>' +
      '</div>' +
      '<div class="tm-grand"><span>Match Score</span><span>' + t.h + ' – ' + t.a + '</span></div>';

    bindTabs();
  }

  function renderSummary(){
    var n = teamSize();
    var t = totals();
    var winning = t.h > t.a ? 'home' : t.a > t.h ? 'away' : 'tied';

    var homeRowsHtml = '', awayRowsHtml = '';
    var homeRows = [], awayRows = [];
    for(var i=0;i<n;i++){
      var pw = playerWins('H', i);
      var name = state.homePlayers[i] || ('Home ' + HOME_LETTERS[i]);
      homeRows.push({L:HOME_LETTERS[i], name:name, w:pw.w, l:pw.l});
      homeRowsHtml += '<div class="summary-row"><span class="name-wrap"><strong>' + HOME_LETTERS[i] + '</strong><span class="name">' + escapeHtml(name) + '</span></span><span class="wl">' + pw.w + '–' + pw.l + '</span></div>';
    }
    for(var i=0;i<n;i++){
      var pw = playerWins('A', i);
      var name = state.awayPlayers[i] || ('Away ' + (i+1));
      awayRows.push({L:(i+1), name:name, w:pw.w, l:pw.l});
      awayRowsHtml += '<div class="summary-row"><span class="name-wrap"><strong>' + (i+1) + '</strong><span class="name">' + escapeHtml(name) + '</span></span><span class="wl">' + pw.w + '–' + pw.l + '</span></div>';
    }

    var fmt = leagueFormat();
    var unit = (fmt === 'juniors') ? 'round' : 'frame';
    var unitsLabel = t.played + ' of ' + t.total + ' ' + unit + (t.total===1?'':'s') + ' played';

    var canSubmit = t.played === t.total;
    var submitLabel = state.submitted ? '✓ Submitted to league' : 'Submit match to league';

    var codeGate =
      '<div class="code-gate">' +
        '<div class="code-gate-hint">Both teams confirm the result by entering their own team code.</div>' +
        '<div class="code-gate-row">' +
          '<div class="field"><span class="field-label">' + escapeHtml(state.homeTeam || 'Home') + ' team code</span>' +
            '<input id="f-hcode" type="password" inputmode="numeric" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="12" placeholder="••••" value="' + escapeHtml(state.homeCode || '') + '"></div>' +
          '<div class="field"><span class="field-label">' + escapeHtml(state.awayTeam || 'Away') + ' team code</span>' +
            '<input id="f-acode" type="password" inputmode="numeric" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="12" placeholder="••••" value="' + escapeHtml(state.awayCode || '') + '"></div>' +
        '</div>' +
      '</div>';

    var submitSection =
      '<div class="submit-section">' +
      (state.submitted ? '' : codeGate) +
      '<button id="submit-btn" class="btn-success" style="width:100%;padding:12px;font-size:var(--fs-sm);" ' + (!canSubmit||state.submitted?'disabled':'') + '>' + submitLabel + '</button>' +
      '<div id="submit-status" class="submit-status info">' +
        (canSubmit ? (state.submitted ? 'Already submitted. Edit any score to re-enable.' : 'Sends match data to the league sheet') : (t.total-t.played) + ' ' + unit + (t.total-t.played===1?'':'s') + ' still to play') +
      '</div>' +
      '</div>';

    app.innerHTML = headerHtml('summary') +
      '<div class="summary-scores"><div class="score-card"><div class="score-card-label">' + escapeHtml(state.homeTeam || 'Home') + '</div><div class="score-card-value">' + t.h + '</div></div><div class="score-card"><div class="score-card-label">' + escapeHtml(state.awayTeam || 'Away') + '</div><div class="score-card-value">' + t.a + '</div></div></div>' +
      '<div class="summary-status">' + unitsLabel + (t.remaining===0 ? ' · ' + (winning==='tied'?'match drawn':winning+' team wins') : '') + '</div>' +
      '<div class="summary-cols"><div><div class="summary-col-title">Home players</div>' + homeRowsHtml + '</div><div><div class="summary-col-title">Away players</div>' + awayRowsHtml + '</div></div>' +
      '<button id="export-btn" style="width:100%;padding:12px;font-size:var(--fs-sm);">Copy match summary</button>' +
      '<div id="export-status" class="export-status"></div>' +
      submitSection;

    bindTabs();

    app.querySelector('#export-btn').addEventListener('click', function(){
      var lines = [];
      lines.push('GNPA scorecard — ' + state.date);
      if(state.league) lines.push('League: ' + state.league);
      lines.push((state.homeTeam||'Home') + ' ' + t.h + ' – ' + t.a + ' ' + (state.awayTeam||'Away'));
      lines.push('');
      lines.push('Home players:');
      for(var i=0;i<homeRows.length;i++){ lines.push('  ' + homeRows[i].L + ' ' + homeRows[i].name + ': ' + homeRows[i].w + 'W ' + homeRows[i].l + 'L'); }
      lines.push('Away players:');
      for(var i=0;i<awayRows.length;i++){ lines.push('  ' + awayRows[i].L + ' ' + awayRows[i].name + ': ' + awayRows[i].w + 'W ' + awayRows[i].l + 'L'); }
      var txt = lines.join('\n');
      var status = app.querySelector('#export-status');
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){
          status.textContent = 'Copied to clipboard';
          setTimeout(function(){ status.textContent = ''; }, 2500);
        }).catch(function(){ status.textContent = 'Copy failed'; });
      } else {
        var ta = document.createElement('textarea');
        ta.value = txt; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); status.textContent = 'Copied'; } catch(e){ status.textContent = 'Copy failed'; }
        document.body.removeChild(ta);
      }
    });

    var submitBtn = app.querySelector('#submit-btn');
    if(submitBtn){
      submitBtn.addEventListener('click', function(){
        submitToLeague();
      });
    }

    var hcodeInput = app.querySelector('#f-hcode');
    if(hcodeInput){
      hcodeInput.addEventListener('input', function(){ state.homeCode = this.value; save(); });
    }
    var acodeInput = app.querySelector('#f-acode');
    if(acodeInput){
      acodeInput.addEventListener('input', function(){ state.awayCode = this.value; save(); });
    }
  }

  function submitToLeague(){
    var status = app.querySelector('#submit-status');
    var btn = app.querySelector('#submit-btn');

    var missing = validatePlayersForSubmit();
    if(missing.missingHome.length || missing.missingAway.length){
      var parts = [];
      if(missing.missingHome.length) parts.push('Home ' + missing.missingHome.join(', '));
      if(missing.missingAway.length) parts.push('Away ' + missing.missingAway.join(', '));
      status.className = 'submit-status err';
      status.textContent = 'Missing player names: ' + parts.join(' · ');
      return;
    }

    if(!(state.homeCode && state.homeCode.trim()) || !(state.awayCode && state.awayCode.trim())){
      status.className = 'submit-status err';
      status.textContent = 'Both teams must enter their code before submitting.';
      return;
    }

    doActualSubmit();
  }

  function doActualSubmit(){
    var status = app.querySelector('#submit-status');
    var btn = app.querySelector('#submit-btn');
    if(!status || !btn) return;
    btn.disabled = true;
    status.className = 'submit-status info';
    status.textContent = 'Submitting...';

    var n = teamSize();
    var fmt = leagueFormat();
    var t = totals();
    var payload = {
      date: state.date,
      league: state.league,
      format: fmt,
      teamSize: n,
      homeTeam: state.homeTeam,
      awayTeam: state.awayTeam,
      homeCaptain: state.homeCaptain,
      awayCaptain: state.awayCaptain,
      homeCode: (state.homeCode || '').trim(),
      awayCode: (state.awayCode || '').trim(),
      homeScore: t.h,
      awayScore: t.a,
      framesPlayed: t.played,
      players: [],
      frames: []
    };

    for(var i=0;i<n;i++){
      var pwH = playerWins('H', i);
      payload.players.push({
        side:'home', position: HOME_LETTERS[i], team: state.homeTeam,
        name: state.homePlayers[i] || '', framesWon: pwH.w, framesPlayed: pwH.w + pwH.l
      });
      var pwA = playerWins('A', i);
      payload.players.push({
        side:'away', position: String(i+1), team: state.awayTeam,
        name: state.awayPlayers[i] || '', framesWon: pwA.w, framesPlayed: pwA.w + pwA.l
      });
    }

    if(fmt === 'threeman'){
      for(var i=0;i<THREEMAN_SINGLES.length;i++){
        var p = THREEMAN_SINGLES[i];
        var hi = p[0], ai = p[1];
        var r = state.results[hi][ai];
        if(r){
          payload.frames.push({
            type: 'singles',
            homePos: HOME_LETTERS[hi], awayPos: String(ai+1),
            homePlayer: state.homePlayers[hi] || '', awayPlayer: state.awayPlayers[ai] || '',
            winner: r === 'H' ? 'home' : 'away'
          });
        }
      }
      for(var d=0;d<THREEMAN_DOUBLES.length;d++){
        var pair = THREEMAN_DOUBLES[d];
        var dr = state.doublesResults[d];
        if(dr){
          payload.frames.push({
            type: 'doubles',
            homePos: pair.home.map(function(i){ return HOME_LETTERS[i]; }).join('+'),
            awayPos: pair.away.map(function(i){ return (i+1); }).join('+'),
            homePlayer: pair.home.map(function(i){ return state.homePlayers[i] || ''; }).join(' + '),
            awayPlayer: pair.away.map(function(i){ return state.awayPlayers[i] || ''; }).join(' + '),
            winner: dr === 'H' ? 'home' : 'away'
          });
        }
      }
    } else if(fmt === 'juniors'){
      for(var g=0;g<JUNIORS_GAMES.length;g++){
        var pair = JUNIORS_GAMES[g];
        var hi = pair[0], ai = pair[1];
        var game = state.juniorsGames[g] || {home:0,away:0};
        var winner = null;
        if(game.home >= JUNIORS_RACE_TO) winner = 'home';
        else if(game.away >= JUNIORS_RACE_TO) winner = 'away';
        if(winner){
          payload.frames.push({
            type: 'race',
            homePos: HOME_LETTERS[hi], awayPos: String(ai+1),
            homePlayer: state.homePlayers[hi] || '', awayPlayer: state.awayPlayers[ai] || '',
            homePoints: game.home, awayPoints: game.away,
            winner: winner
          });
        }
      }
    } else {
      for(var i=0;i<n;i++){
        for(var j=0;j<n;j++){
          var r = state.results[i][j];
          if(r){
            payload.frames.push({
              type: 'singles',
              homePos: HOME_LETTERS[i], awayPos: String(j+1),
              homePlayer: state.homePlayers[i] || '', awayPlayer: state.awayPlayers[j] || '',
              winner: r === 'H' ? 'home' : 'away'
            });
          }
        }
      }
    }

    fetch(LEAGUE_ENDPOINT, {
      method: 'POST',
      mode: 'cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function(res){
      return res.text().then(function(txt){
        var data;
        try { data = JSON.parse(txt); } catch(e) { data = { ok: res.ok, message: txt }; }
        if(res.ok && data.ok !== false){
          status.className = 'submit-status ok';
          status.textContent = '✓ Submitted successfully';
          state.submitted = true;
          state.homeCode = '';
          state.awayCode = '';
          save();
          setTimeout(render, 1200);
        } else {
          throw new Error(data.message || 'Server returned ' + res.status);
        }
      });
    }).catch(function(err){
      status.className = 'submit-status err';
      status.textContent = 'Failed: ' + err.message;
      btn.disabled = false;
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', render);
  } else {
    render();
  }
})();
</script>
</body>
</html>
